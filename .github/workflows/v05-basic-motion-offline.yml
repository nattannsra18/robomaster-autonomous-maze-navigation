name: V05 Basic Motion Offline Checks
on:
  push:
    branches:
      - refactor/v05-basic-motion-91fa792
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install offline-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install robomaster==0.1.1.68 numpy==1.24.4 opencv-python-headless==4.8.1.78
      - name: Syntax validation
        run: |
          python -m compileall -q classwork8 final_round1_tof_camera_01.py diagnose_chassis_drift_v05.py diagnose_zero_command_v05.py diagnose_wheel_zero_v05.py diagnose_wheel_zero_gimbal_v05.py tests
      - name: Offline regressions (no robot connected)
        run: |
          python -m unittest tests.test_basic_heading_v05 tests.test_final_gimbal_pitch_v05 tests.test_final_motion_safety_v05 tests.test_basic_gui_config_v05 tests.test_final_target_detection tests.test_diagnose_chassis_drift_v05 tests.test_diagnose_zero_command_v05 tests.test_diagnose_wheel_zero_v05 tests.test_diagnose_wheel_zero_gimbal_v05 tests.test_v05_wheel_stop tests.test_v05_heading_guard tests.test_v05_wall_clearance -v
